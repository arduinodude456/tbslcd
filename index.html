<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TBS LCD Bitmap Converter</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    text-align: center;
    padding: 20px;
}

h1 {
    margin-bottom: 5px;
}

p {
    color: #aaa;
}

input {
    margin: 20px;
}

canvas {
    image-rendering: pixelated;
    border: 2px solid #555;
    width: 400px;
    max-width: 90vw;
    height: auto;
    background: black;
}

button {
    padding: 12px 20px;
    margin: 10px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}

textarea {
    width: 95%;
    max-width: 800px;
    height: 350px;
    margin-top: 20px;
    background: #050505;
    color: #00ff88;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 10px;
    font-family: monospace;
    font-size: 13px;
}
</style>
</head>

<body>

<h1>TBS LCD Bitmap Converter</h1>

<p>20 × 16 Pixel · 8 Graustufen</p>

<input type="file" id="file" accept="image/*">

<br>

<canvas id="canvas" width="20" height="16"></canvas>

<br>

<button onclick="generate()">Arduino-Array erzeugen</button>
<button onclick="copyCode()">Code kopieren</button>

<textarea id="output" readonly
placeholder="Hier erscheint dein Arduino-Code..."></textarea>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let imageLoaded = false;

document.getElementById("file").addEventListener("change", function(e) {

    const file = e.target.files[0];

    if (!file) return;

    const img = new Image();

    img.onload = function() {

        /*
         * Bild auf 20 × 16 Pixel skalieren.
         */
        ctx.clearRect(0, 0, 20, 16);

        ctx.drawImage(
            img,
            0,
            0,
            20,
            16
        );

        imageLoaded = true;
    };

    img.src = URL.createObjectURL(file);
});


function generate() {

    if (!imageLoaded) {

        alert("Bitte zuerst ein Bild auswählen.");

        return;
    }

    const pixels =
        ctx.getImageData(0, 0, 20, 16).data;

    let output = "";

    output += "const byte image[16][20] = {\n";

    for (let y = 0; y < 16; y++) {

        output += "  {";

        for (let x = 0; x < 20; x++) {

            const index =
                (y * 20 + x) * 4;

            const r = pixels[index];
            const g = pixels[index + 1];
            const b = pixels[index + 2];

            /*
             * Helligkeit berechnen.
             */
            const brightness =
                0.299 * r +
                0.587 * g +
                0.114 * b;

            /*
             * 0–255 → 0–7
             */
            const level =
                Math.round(brightness * 7 / 255);

            output += level;

            if (x < 19)
                output += ",";
        }

        output += "}";

        if (y < 15)
            output += ",";

        output += "\n";
    }

    output += "};";

    document.getElementById("output").value =
        output;
}


function copyCode() {

    const output =
        document.getElementById("output");

    if (!output.value) {

        alert("Erzeuge zuerst das Array.");

        return;
    }

    output.select();

    navigator.clipboard.writeText(
        output.value
    );

    alert("Arduino-Code kopiert!");
}

</script>

<script src="https://keepandroidopen.org/banner.js"></script>
</body>
</html>
